<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="msapplication-tap-highlight" content="no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>3DBuildBot</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #020617; color: #f8fafc; font: 14px/1.5 -apple-system, "SF Pro Text", "SF Pro Display", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    .logo { width: 96px; height: 96px; border-radius: 22px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 60px -20px rgba(37, 99, 235, 0.7); font-size: 32px; font-weight: 800; letter-spacing: -0.02em; }
    h1 { margin-top: 24px; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
    p { margin-top: 8px; color: #94a3b8; font-size: 13px; }
    .spinner { margin-top: 32px; width: 24px; height: 24px; border: 2.5px solid #1e293b; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer { position: fixed; bottom: env(safe-area-inset-bottom, 12px); left: 0; right: 0; text-align: center; font-size: 10px; color: #475569; letter-spacing: 0.12em; text-transform: uppercase; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  </style>
</head>
<body>
  <div class="logo">3D</div>
  <h1>3DBuildBot</h1>
  <p>Instant CAD quotes · US-made parts</p>
  <div class="spinner"></div>
  <footer>ISO 9001 · AS9100D · ITAR-Registered</footer>
  <script>
    setTimeout(function () { window.location.href = "https://3dbuildbot.vercel.app/"; }, 500);
  </script>
</body>
</html>
