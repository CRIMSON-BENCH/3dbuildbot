version: 2
updates:
  # npm packages — weekly PRs for outdated deps, immediate for security patches
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # group non-major updates to reduce PR noise
    groups:
      production-minor:
        applies-to: version-updates
        dependency-type: "production"
        update-types: ["minor", "patch"]
      dev-minor:
        applies-to: version-updates
        dependency-type: "development"
        update-types: ["minor", "patch"]

  # GitHub Actions workflows — check monthly
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
